services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: mirror, POSTGRES_PASSWORD: mirror, POSTGRES_DB: mirror }
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mirror:mirror@db:5432/mirror
    ports: ["8000:8000"]
    volumes: [appdata:/data]
    depends_on: [db]
volumes: { pgdata: {}, appdata: {} }

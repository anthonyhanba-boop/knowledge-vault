<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror — Visual Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='none' stroke='%237c8cff' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%2335e0c4'/></svg>">
</head>
<body>
<div class="bg-glow"></div>
<header class="nav">
  <a class="brand" href="#/" aria-label="Mirror home">
    <svg viewBox="0 0 32 32" width="26" height="26"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#35e0c4"/></linearGradient></defs><circle cx="16" cy="16" r="12" fill="none" stroke="url(#g)" stroke-width="3"/><circle cx="16" cy="16" r="4.5" fill="url(#g)"/></svg>
    <span>Mirror</span><em>visual search</em>
  </a>
  <nav>
    <a href="#/" data-nav="home">Search</a>
    <a href="#/history" data-nav="history">History</a>
    <a href="#/saved" data-nav="saved">Saved</a>
    <a href="#/status" data-nav="status"><span class="dot" id="navDot"></span>Status</a>
  </nav>
</header>

<main id="view"></main>

<div id="toast" role="status" aria-live="polite"></div>

<template id="tpl-home">
  <section class="hero">
    <h1>Find where an image lives on the web.</h1>
    <p class="sub">Exact copies, resized and cropped versions, and visually similar images. Results come from real reverse-search providers, and Mirror re-checks them with its own perceptual hashing.</p>
    <form id="searchForm" class="drop" tabindex="0">
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp" hidden>
      <div class="drop-empty">
        <div class="drop-icon"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></div>
        <strong>Drop an image here</strong>
        <span>or paste from the clipboard. JPG, PNG, WebP, GIF or BMP, up to <b id="maxMb">10</b> MB</span>
        <button type="button" class="btn ghost" id="browse">Browse files</button>
      </div>
      <div class="drop-preview" hidden>
        <img id="preview" alt="Selected image preview">
        <div class="preview-meta">
          <div class="fname" id="fname"></div>
          <div class="muted" id="fmeta"></div>
          <label class="consent"><input type="checkbox" id="consent"> I own this image or have the right to search it. Mirror deletes the original once the search finishes, and never uses facial or biometric identification.</label>
          <div class="row">
            <button type="submit" class="btn primary" id="go" disabled>Search the web</button>
            <button type="button" class="btn ghost" id="clear">Change image</button>
          </div>
        </div>
      </div>
    </form>
    <div class="provider-strip" id="providerStrip"></div>
  </section>
  <section class="recent">
    <div class="section-head"><h2>Recent searches</h2><a href="#/history" class="link">View all</a></div>
    <div class="recent-grid" id="recent"></div>
  </section>
</template>

<template id="tpl-search">
  <section class="results-layout">
    <aside class="side">
      <div class="query-card">
        <img id="qthumb" alt="Query image">
        <div class="qmeta" id="qmeta"></div>
      </div>
      <div class="progress-card" id="progressCard">
        <div class="stage" id="stage">Starting…</div>
        <div class="bar"><i id="bar"></i></div>
        <ul class="prov-status" id="provStatus"></ul>
        <button class="btn ghost small" id="retry" hidden>Retry failed providers</button>
      </div>
      <form class="filters" id="filters">
        <h3>Match type</h3>
        <label><input type="checkbox" name="mt" value="exact" checked> Exact <span class="cnt" data-c="exact"></span></label>
        <label><input type="checkbox" name="mt" value="near_duplicate" checked> Near-duplicate / resized <span class="cnt" data-c="near_duplicate"></span></label>
        <label><input type="checkbox" name="mt" value="cropped" checked> Cropped / partial <span class="cnt" data-c="cropped"></span></label>
        <label><input type="checkbox" name="mt" value="similar" checked> Similar <span class="cnt" data-c="similar"></span></label>
        <h3>Source</h3>
        <label><input type="radio" name="src" value="all" checked> All sources</label>
        <label><input type="radio" name="src" value="news"> News articles</label>
        <label><input type="radio" name="src" value="web"> Other public websites</label>
        <label><input type="checkbox" name="pageonly"> Only results with a webpage</label>
        <label><input type="checkbox" name="verified"> Only results Mirror re-checked</label>
        <h3>Image format</h3>
        <div class="chips" id="fmtChips"></div>
        <h3>Date indexed <span class="hint" title="Only TinEye provides crawl dates">ⓘ</span></h3>
        <div class="dates"><input type="date" name="from" aria-label="From"><input type="date" name="to" aria-label="To"></div>
        <h3>Domain</h3>
        <input type="text" name="domain" placeholder="e.g. flickr.com, -pinterest.com" autocomplete="off">
        <label><input type="checkbox" name="showHidden"> Show hidden results</label>
      </form>
    </aside>
    <div class="main-col">
      <div class="toolbar">
        <div><h2 id="rcount">Results</h2><div class="muted small" id="rsub"></div></div>
        <div class="row">
          <select id="groupBy" aria-label="Group results"><option value="match">Group by match type</option><option value="domain">Group by domain</option><option value="none">No grouping</option></select>
          <div class="menu"><button class="btn ghost" id="exportBtn">Export ▾</button>
            <div class="menu-pop" id="exportMenu" hidden>
              <a data-fmt="html">HTML report</a><a data-fmt="csv">CSV spreadsheet</a><a data-fmt="json">JSON data</a>
            </div></div>
        </div>
      </div>
      <div id="results"></div>
    </div>
  </section>
</template>
<script src="/app.js" type="module"></script>
</body>
</html>
